# Fragment applicato sopra il config ufficiale linux-zen
# (via prepare-pkgbuild.sh, poi 'make olddefconfig' in prepare()).
#
# LEZIONE APPRESA (build 7.2.8): INTEL_ATOMISP e' un simbolo *bool*
# (menuconfig), NON tristate: con "=m" olddefconfig lo scarta con
# "warning: symbol value 'm' invalid for INTEL_ATOMISP" e VIDEO_ATOMISP
# (che dipende da INTEL_ATOMISP) resta invisibile -> niente driver.

# Menuconfig del supporto AtomISP: bool -> =y (MAI =m)
CONFIG_INTEL_ATOMISP=y

# Il driver ISP vero e proprio (modulo: atomisp.ko)
CONFIG_VIDEO_ATOMISP=m

# Dipendenze hard di VIDEO_ATOMISP (gia' attive nella config zen,
# le pinniamo per sicurezza)
CONFIG_INTEL_SKL_INT3472=m
CONFIG_IPU_BRIDGE=m

# Sensori atomisp-specifici rimasti in staging; il MT9M114 (camera di
# questo HP Pavilion x2) e' gia' =m nella config zen come VIDEO_MT9M114.
CONFIG_VIDEO_ATOMISP_OV2722=m
CONFIG_VIDEO_ATOMISP_GC2235=m

# NB: non serve toccare INTEL_ATOMISP2_PM: il suo Kconfig dipende da
# !INTEL_ATOMISP, quindi si auto-esclude quando il driver e' attivo
# (e con lui sparisce il conflitto D3cold su 00:03.0).
