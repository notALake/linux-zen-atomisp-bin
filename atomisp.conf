# Fragment applicato sopra il config ufficiale linux-zen.
# La sintassi kernel standard: riga "X=m" abilita come modulo,
# riga "# X is not set" la disabilita.

CONFIG_INTEL_ATOMISP=m
CONFIG_VIDEO_ATOMISP=m

# Sensori AtomISP (best-effort: i simboli inesistenti vengono ignorati
# dallo script prepare-pkgbuild.sh, quelli esistenti compilati come moduli)
CONFIG_VIDEO_ATOMISP_OV2680=m
CONFIG_VIDEO_ATOMISP_GC0310=m
CONFIG_VIDEO_ATOMISP_OV8835=m
CONFIG_VIDEO_ATOMISP_GC2235=m
CONFIG_VIDEO_ATOMISP_OV2722=m
CONFIG_VIDEO_ATOMISP_OV5693=m
CONFIG_VIDEO_ATOMISP_GC0310=m
CONFIG_VIDEO_ATOMISP_MS5821A=m
CONFIG_VIDEO_ATOMISP_MT9M114=m
CONFIG_VIDEO_ATOMISP_GC2155=m

# Bridge CSI2 AtomISP (se presente come simbolo separato)
CONFIG_VIDEO_ATOMISP_CSI2_BRIDGE=m

# Lo stub PM va disabilitato quando AtomISP e abilitato,
# altrimenti si contendono 00:03.0 [8086:22b8] e danno D3cold/boot-hang.
# CONFIG_INTEL_ATOMISP2_PDX86 is not set
