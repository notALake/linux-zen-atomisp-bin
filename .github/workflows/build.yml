name: build-linux-zen-atomisp

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      upstream_version: ${{ steps.upstream.outputs.version }}
      expected_tag: ${{ steps.decide.outputs.expected_tag }}
      patchset: ${{ steps.decide.outputs.patchset }}
    steps:
      - name: Legge versione ufficiale linux-zen
        id: upstream
        run: |
          VER=$(curl -fsSL https://archlinux.org/packages/extra/x86_64/linux-zen/json/ | python3 -c 'import sys, json; d = json.load(sys.stdin); ep = d.get("epoch") or 0; print((f"{ep}:" if ep else "") + d["pkgver"] + "-" + d["pkgrel"])')
          echo "Upstream: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Legge ultima Release di questa repo
        id: built
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name','none'))" 2>/dev/null || echo none)
          echo "Ultima release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide se compilare
        id: decide
        run: |
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          TAG="${{ steps.built.outputs.tag }}"
          # numero di patchset corrente (patch 0001..000N): usato nel tag
          # E nel pkgrel del pacchetto (1.N) cosi' pacman vede gli aggiornamenti
          PATCHSET=4
          EXPECTED="v${UPSTREAM}-atomisp${PATCHSET}"
          echo "expected_tag=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "patchset=$PATCHSET" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$EXPECTED" ]; then
            echo "Gia compilato, skip."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nuova versione, compilo $EXPECTED"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      UPSTREAM_VERSION: ${{ needs.check.outputs.upstream_version }}
      EXPECTED_TAG: ${{ needs.check.outputs.expected_tag }}
      PATCHSET: ${{ needs.check.outputs.patchset }}
    steps:
      - name: Spazio disco iniziale
        run: df -h

      - name: Installa deps build
        run: |
          pacman -Syu --noconfirm --needed base-devel git ccache python sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4
        with:
          path: repo-files

      - name: Prepara PKGBUILD rinominato
        run: |
          cp repo-files/atomisp.conf .
          cp repo-files/prepare-pkgbuild.sh .
          cp repo-files/patches/*.patch .
          chmod +x prepare-pkgbuild.sh
          ./prepare-pkgbuild.sh
          ls -la upstream-linux-zen/
          grep -E "pkgbase|pkgname" upstream-linux-zen/PKGBUILD | head

      - name: Importa chiavi PGP upstream
        run: |
          # validpgpkeys nel PKGBUILD elenca le chiavi che firmano i tarball del
          # kernel, ma non sono in archlinux-keyring: makepkg fallirebbe con
          # "unknown public key". Le importiamo dalla dir keys/pgp/ del packaging.
          # makepkg gira come 'builder', quindi il keyring deve essere il suo.
          install -d -m 700 -o builder -g builder /home/builder/.gnupg
          for k in upstream-linux-zen/keys/pgp/*.asc; do
            echo "importo $(basename "$k")"
            sudo -u builder gpg --batch --quiet --import "$k"
          done
          echo "--- chiavi nel keyring di builder ---"
          sudo -u builder gpg --batch --list-keys --keyid-format LONG | grep -E '^(pub|uid)' | head -20

      - name: Compila (come builder, makepkg vieta root)
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd upstream-linux-zen
          sudo -u builder MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm --noprogressbar
          ls -lh ./*.pkg.tar.zst

      - name: Crea Release con kernel compilato
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EXPECTED_TAG }}
          name: "linux-zen-atomisp ${{ env.UPSTREAM_VERSION }}"
          body: |
            Build automatica di linux-zen ${{ env.UPSTREAM_VERSION }} con AtomISP abilitato
            (driver camera MT9M114 + patch affidabilita'/rotazione: vedi patches/).
            Installazione: vedi README / ISTRUZIONI.txt.
            File: linux-zen-atomisp-*.pkg.tar.zst + linux-zen-atomisp-headers-*.pkg.tar.zst
            Firmware manuale: /lib/firmware/shisp_2401a0_v21.bin
          files: upstream-linux-zen/*.pkg.tar.zst
